[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zod-self-driving-lab"
version = "1.0.0"
description = "A ZOD deep-learning lab for trajectory forecasting, segmentation, and LiDAR BEV perception"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Christian Jenei" }]
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "matplotlib>=3.8",
  "pandas>=2.1",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "torchvision>=0.17",
]

[project.optional-dependencies]
zod = ["zod==0.8.0", "dataclass-wizard==0.39.1"]
notebooks = ["jupyter>=1.0", "nbformat>=5.9", "nbclient>=0.9"]
bev = ["opencv-python>=4.9"]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]
all = [
  "build>=1.2",
  "zod==0.8.0",
  "dataclass-wizard==0.39.1",
  "jupyter>=1.0",
  "nbformat>=5.9",
  "nbclient>=0.9",
  "opencv-python>=4.9",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "slow: tests that train a model or execute a notebook",
  "requires_zod: tests that need a private/external ZOD installation and data",
  "requires_onnx: tests that need ONNX and ONNX Runtime",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["artifacts", "build", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
